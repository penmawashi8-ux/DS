name: Fetch Eisei Kanrisha published exam PDFs

on:
  push:
    branches: [claude/advanced-exam-solutions-sales-3qosq0]
    paths: [.github/workflows/fetch-eisei-pdf.yml, scripts/fetch_eisei.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl exam.or.jp for 衛生管理者 公表問題 PDFs
        run: python3 scripts/fetch_eisei.py
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eisei/pdf
          git diff --cached --quiet || git commit -m "Add 衛生管理者 公表問題 PDFs from exam.or.jp"
          git push
