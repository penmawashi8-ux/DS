<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>SC午後 過去問解説</title>
<meta name="description" content="情報処理安全確保支援士試験 午後（新形式）の過去問を、問題文の書き起こし・解答と解説・公式解答例との照合で整理した学習サイト">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="vendor/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface2: #eef1f5; --border: #dde2e8;
  --text: #1c2430; --muted: #5d6b7a; --accent: #1f6feb; --accent-weak: #e3edff;
  --ok: #1a7f37; --ok-weak: #dcf5e3; --mid: #9a6700; --mid-weak: #fff3cd;
  --ng: #cf222e; --ng-weak: #ffe2e0; --code-bg: #f1f3f6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #161c25; --surface2: #1d2531; --border: #2b3544;
    --text: #e6ebf1; --muted: #93a1b2; --accent: #58a6ff; --accent-weak: #15253d;
    --ok: #3fb950; --ok-weak: #12301c; --mid: #d29922; --mid-weak: #33270b;
    --ng: #f85149; --ng-weak: #3b1513; --code-bg: #1b222d; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161c25; --surface2: #1d2531; --border: #2b3544;
  --text: #e6ebf1; --muted: #93a1b2; --accent: #58a6ff; --accent-weak: #15253d;
  --ok: #3fb950; --ok-weak: #12301c; --mid: #d29922; --mid-weak: #33270b;
  --ng: #f85149; --ng-weak: #3b1513; --code-bg: #1b222d; --shadow: none;
}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.75; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { font-weight: 700; color: var(--text); white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.spacer { flex: 1; }
.iconbtn { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 8px; height: 34px; min-width: 34px; cursor: pointer; font-size: 15px; }
main { padding: 24px 0 64px; }
h1.page { font-size: 1.5rem; margin: 0 0 4px; line-height: 1.4; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: .92rem; }
.search { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; margin-bottom: 20px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 24px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 1.4rem; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .8rem; }
.exam { margin-bottom: 28px; }
.exam-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.exam-h h2 { font-size: 1.1rem; margin: 0; }
.exam-h a { font-size: .85rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--text); box-shadow: var(--shadow); position: relative; transition: border-color .15s; }
.card:hover { border-color: var(--accent); text-decoration: none; }
.card .qno { font-size: .78rem; color: var(--muted); font-weight: 500; }
.card .theme { font-weight: 700; margin: 2px 0 6px; line-height: 1.45; }
.card .lead { font-size: .8rem; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .done { position: absolute; top: 10px; right: 12px; font-size: .75rem; color: var(--ok); font-weight: 700; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface2); margin-top: 10px; }
.bar i { display: block; height: 100%; }
.bar .j1 { background: var(--ok); } .bar .j2 { background: color-mix(in srgb, var(--ok) 55%, var(--surface2)); }
.bar .j3 { background: var(--mid); } .bar .j4 { background: var(--ng); }
.legend { font-size: .75rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin: -8px 0 20px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.crumbs { font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
.qhead { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
.qhead h1 { flex: 1; min-width: 220px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 14px; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow); }
.gate { text-align: center; padding: 36px 16px; }
.gate p { color: var(--muted); margin: 0 0 14px; }
.btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; font: inherit; font-weight: 500; cursor: pointer; }
.btn.ghost { background: none; color: var(--text); border: 1px solid var(--border); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); cursor: pointer; user-select: none; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.pager a { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: .9rem; }
/* markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1 { font-size: 1.25rem; margin: 0 0 12px; line-height: 1.5; }
.md h2 { font-size: 1.1rem; margin: 28px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.md h3 { font-size: 1rem; margin: 22px 0 8px; }
.md p, .md ul, .md ol { margin: 0 0 12px; }
.md blockquote { margin: 0 0 14px; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--accent-weak); border-radius: 0 8px 8px 0; color: var(--text); font-size: .9rem; }
.md blockquote p { margin: 4px 0; }
.md code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .85em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.55; }
.md pre code { background: none; padding: 0; font-size: .8rem; white-space: pre; }
/* 罫線の図：1文字ずつ固定幅のマスに置いて，全角2マス・半角1マスで揃える */
.md pre.diagram { line-height: 1.25; position: relative; }
.md pre.diagram.wide::after { content: "← 横にスクロールできます →"; position: sticky; left: 0; display: block; margin-top: 6px; font-size: 11px; color: var(--muted); font-family: "Noto Sans JP", sans-serif; }
.diagram .ln { display: block; white-space: nowrap; height: 1.25em; }
.diagram .c { display: inline-flex; justify-content: center; width: var(--cw); overflow: visible; font-family: "Noto Sans JP", system-ui, sans-serif; }
.diagram .c.w { width: calc(var(--cw) * 2); }
.diagram .dblank { color: var(--accent); font-weight: 700; }
/* 図表中の文章：元の改行位置で折れていた行をつないで，普通の文章として折り返す */
.md .figtext { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; white-space: pre-wrap; font-size: .92em; line-height: 1.75; overflow-wrap: anywhere; }
.tbl { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--border); border-radius: 8px; }
.md table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.md th, .md td { border-bottom: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
.md tr:last-child td { border-bottom: none; }
.md th { background: var(--surface2); font-weight: 700; white-space: nowrap; }
.md td + td, .md th + th { border-left: 1px solid var(--border); }
.md hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
/* 1文ずつ区切って表示（目次・文字シートで切替） */
.md .sn { display: block; }
.md .sn + .sn { margin-top: .55em; }
/* 空欄［ a ］を目立たせる */
.md .blank { display: inline-block; min-width: 2.2em; text-align: center; padding: 0 .3em; margin: 0 .1em; border: 1.5px solid var(--accent); border-radius: 5px; color: var(--accent); font-weight: 700; line-height: 1.35; }
.md a.ref { color: var(--accent); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.md a.ref .blank { text-decoration: none; }
@keyframes flash { 0%, 60% { background: color-mix(in srgb, var(--mid) 35%, transparent); } 100% { background: transparent; } }
.md .flash { animation: flash 2.2s ease-out; border-radius: 4px; }
.backbtn { position: fixed; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 25; border: none; border-radius: 999px; padding: 10px 16px; background: var(--accent); color: #fff; font: inherit; font-size: .88rem; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; }
.md u { text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.j-ok { color: var(--ok); font-weight: 700; } .j-mid { color: var(--mid); font-weight: 700; } .j-ng { color: var(--ng); font-weight: 700; }
footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .8rem; padding: 20px 0 40px; }
.err { color: var(--ng); }
/* 問題ページ：上部固定タブ・下部固定バー・目次シート */
body { -webkit-tap-highlight-color: transparent; }
header.top { padding-top: env(safe-area-inset-top); }
.wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.md { font-size: calc(1rem * var(--fs, 1)); }
.qview .tabs { position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 9; background: var(--bg); margin: 0 0 14px; }
.qview .md h2, .qview .md h3, .qview .md .q-anchor { scroll-margin-top: calc(110px + env(safe-area-inset-top)); }
.md .q-anchor { background: var(--accent-weak); border-radius: 8px; padding: 8px 10px; }
body.in-q main { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
body.in-q footer { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
.qbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.qbar .wrap { display: flex; gap: 6px; align-items: center; height: 52px; }
.qbar button, .qbar a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer; text-decoration: none; touch-action: manipulation; white-space: nowrap; }
.qbar .dis { opacity: .35; pointer-events: none; }
.qbar .on { background: var(--ok-weak); border-color: var(--ok); color: var(--ok); }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 18px 18px 0 0; padding: 10px 0 calc(16px + env(safe-area-inset-bottom)); max-height: 75vh; overflow-y: auto; box-shadow: 0 -4px 20px rgba(0,0,0,.2); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 10px; }
.sheet h3 { margin: 0 0 8px; font-size: 1rem; }
.toc a { display: block; padding: 10px 4px; border-bottom: 1px solid var(--border); color: var(--text); font-size: .92rem; line-height: 1.5; }
.toc a.lv3 { padding-left: 18px; font-size: .86rem; color: var(--muted); }
.toc a.qs { font-weight: 700; color: var(--accent); }
.fsrow { display: flex; gap: 8px; align-items: center; margin: 4px 0 14px; font-size: .88rem; color: var(--muted); }
.fsrow button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }
.fsrow button { flex: 1; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
@media (max-width: 560px) {
  header.top .wrap { height: 50px; gap: 8px; }
  /* 問題ページではサイトのヘッダーを固定せず，タブだけを上に固定する */
  body.in-q header.top { position: relative; }
  .qview .tabs { top: 0; padding-top: env(safe-area-inset-top) !important; }
  /* 下にスクロールして読んでいる間はタブと下部バーを隠し，上にスクロールすると出す */
  .qview .tabs, .qbar { transition: transform .2s ease; }
  body.reading .qview .tabs { transform: translateY(-100%); }
  body.reading .qbar { transform: translateY(100%); }
  .brand { font-size: .98rem; }
  .brand small { display: none; }
  main { padding-top: 14px; }
  h1.page { font-size: 1.15rem; }
  .sub { font-size: .86rem; margin-bottom: 14px; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { padding: 10px 12px; }
  .stat b { font-size: 1.2rem; }
  .grid { grid-template-columns: 1fr; gap: 8px; }
  .card { padding: 12px 14px; }
  .card .lead { -webkit-line-clamp: 1; }
  .legend { gap: 8px; }
  /* 本文は余白を詰めて全幅で読む */
  .qview .panel { padding: 4px 0; border: none; background: none; box-shadow: none; }
  .qview .tabs { margin: 0 -16px 10px; padding: 0 8px; }
  .qview .tabs button { flex: 1; padding: 7px 6px; font-size: .85rem; }
  .qview .qhead { margin-bottom: 6px; }
  .qview .crumbs { font-size: .78rem; margin-bottom: 2px; }
  .qview h1.page { font-size: 1.02rem; }
  .qview .qhead .check { display: none; }
  .qview .pager { display: none; }
  .md { line-height: 1.9; font-size: calc(16px * var(--fs, 1)); }
  .md p { margin-bottom: 1.3em; }
  .md li { margin-bottom: .5em; }
  .md h1 { font-size: 1.05rem; }
  .md h2 { font-size: 1.02rem; margin: 24px 0 8px; }
  .md h3 { font-size: .96rem; }
  .md pre { margin-left: -16px; margin-right: -16px; border-radius: 0; border-left: none; border-right: none; padding: 10px 16px; }
  .md pre code { white-space: pre-wrap; word-break: break-all; font-size: .76rem; }
  .md .figtext { margin-left: -16px; margin-right: -16px; border-radius: 0; border-left: none; border-right: none; padding: 12px 16px; }
  .tbl { margin-left: -16px; margin-right: -16px; border-radius: 0; border-left: none; border-right: none; }
  .md table { font-size: .8rem; }
  .md th { white-space: normal; }
  /* 列が潰れて1文字ずつ折り返さないよう最小幅を取り，はみ出す表は横スクロール */
  .md td, .md th { min-width: 7em; }
  .md td:first-child, .md th:first-child { min-width: 4.5em; }
  .qview .md > h1:first-child { display: none; }
  .md th, .md td { padding: 6px 8px; }
  .md blockquote { font-size: .86rem; padding: 8px 12px; }
  footer { font-size: .76rem; }
}
@media (min-width: 561px) { .qbar { display: none; } body.in-q main, body.in-q footer { padding-bottom: revert; } }
</style>

<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">SC午後 過去問解説<small>情報処理安全確保支援士</small></a>
  <span class="spacer"></span>
  <a href="am2/" style="font-size:.88rem;white-space:nowrap">午前II 道場 →</a>
  <button class="iconbtn" id="themeBtn" title="表示テーマ切替" aria-label="表示テーマ切替">🌓</button>
</div></header>
<main><div class="wrap" id="app"><p class="sub">読み込み中…</p></div></main>
<footer><div class="wrap">
  出典：独立行政法人情報処理推進機構（IPA）「情報処理安全確保支援士試験 午後 問題・解答例」。問題文は画像PDFからの書き起こしで、誤記の可能性があります。正確な内容は<a href="https://www.ipa.go.jp/shiken/mondai-kaiotu/index.html" target="_blank" rel="noopener">IPAの公開資料</a>を確認してください。解答・解説は本サイト独自のもので、IPAの公式見解ではありません。
</div></footer>
<script>
(() => {
  const $app = document.getElementById("app");
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sc:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("sc:" + k, JSON.stringify(v)); } catch {} },
  };
  // theme
  const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  applyTheme(store.get("theme", null));
  document.getElementById("themeBtn").onclick = () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    applyTheme(next); store.set("theme", next);
  };

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const cache = {};
  const load = async path => {
    if (!(path in cache)) {
      cache[path] = fetch(path).then(r => { if (!r.ok) throw new Error(path + " (" + r.status + ")"); return r.text(); });
    }
    return cache[path];
  };
  marked.setOptions({ gfm: true, breaks: false });
  // 本文中の「<script>」などはタグとしてではなく文字として表示する（書式用の u/sup/sub/br だけ通す）
  const escapeRawHtml = md => md.split(/(^```[\s\S]*?^```)/m).map((part, i) => i % 2 ? part :
    part.split(/(`[^`\n]*`)/).map((t, j) => j % 2 ? t : t.replace(/<(?!\/?(?:u|sup|sub|br)\b[^>]*>)/gi, "&lt;")).join("")).join("");
  const render = md => {
    const html = marked.parse(escapeRawHtml(md))
      .replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>")
      .replace(/(<td>\s*)(<strong>)?(◎|○)(<\/strong>)?(\s*<\/td>)/g, '$1<span class="j-ok">$3</span>$5')
      .replace(/(<td>\s*)(<strong>)?(△)(<\/strong>)?(\s*<\/td>)/g, '$1<span class="j-mid">$3</span>$5')
      .replace(/(<td>\s*)(<strong>)?(×)(<\/strong>)?(\s*<\/td>)/g, '$1<span class="j-ng">$3</span>$5');
    let n = 0;
    const out = html
      .replace(/<h([23])>/g, (m, lv) => `<h${lv} id="s${n++}">`)
      .replace(/<p><strong>(設問\s*\d+)<\/strong>/g, (m, t) => `<p class="q-anchor" id="s${n++}"><strong>${t}</strong>`);
    return '<div class="md">' + out + "</div>";
  };
  // split a markdown file at "## " headings -> { common: [...], q: {1: "...", ...} }
  const splitSections = md => {
    const out = { head: "", common: [], q: {} };
    let cur = null, buf = "";
    const flush = () => {
      if (cur === null) out.head += buf;
      else if (cur.q) out.q[cur.q] = (out.q[cur.q] || "") + buf;
      else out.common.push(buf);
      buf = "";
    };
    for (const line of md.split(/(?<=\n)/)) {
      const m = line.match(/^##\s+(.*)/);
      if (m) { flush(); const qm = m[1].match(/^問\s*(\d)/); cur = qm ? { q: +qm[1] } : { title: m[1] }; }
      buf += line;
    }
    flush();
    return out;
  };

  let manifest = null;
  const doneKey = (e, n) => "done:" + e + ":" + n;
  const judgeBar = j => {
    const total = j["◎"] + j["○"] + j["△"] + j["×"];
    if (!total) return "";
    const seg = (k, c) => j[k] ? `<i class="${c}" style="width:${(j[k] / total * 100).toFixed(1)}%"></i>` : "";
    return `<div class="bar" title="◎${j["◎"]} ○${j["○"]} △${j["△"]} ×${j["×"]}">${seg("◎", "j1")}${seg("○", "j2")}${seg("△", "j3")}${seg("×", "j4")}</div>`;
  };

  function viewHome(filter = "") {
    const f = filter.trim().toLowerCase();
    const exams = manifest.exams;
    let nq = 0, nd = 0, jt = { "◎": 0, "○": 0, "△": 0, "×": 0 };
    exams.forEach(e => e.questions.forEach(q => { nq++; if (store.get(doneKey(e.id, q.no), false)) nd++; for (const k in jt) jt[k] += q.judge[k]; }));
    const judged = jt["◎"] + jt["○"] + jt["△"] + jt["×"];
    const rate = judged ? Math.round((jt["◎"] + jt["○"]) / judged * 100) : 0;
    let html = `<h1 class="page">情報処理安全確保支援士 午後 過去問解説</h1>
      <p class="sub">新形式（令和5年度秋期〜）の午後問題を、問題文の書き起こし、<b>公式解答例に沿った解答と解説</b>、公式解答例との照合（初回に答えを見ずに解いたときの読み違いの記録）の3点セットで掲載しています。</p>
      <div class="stats">
        <div class="stat"><b>${exams.length}</b><span>回分</span></div>
        <div class="stat"><b>${nq}</b><span>問</span></div>
        <div class="stat"><b>${rate}%</b><span>初回の解答が公式と要点一致（◎＋○）</span></div>
        <div class="stat"><b>${nd} / ${nq}</b><span>あなたが解いた問題</span></div>
      </div>
      <input class="search" id="q" type="search" placeholder="テーマや題材で絞り込み（例：JWT、DNS、ログ）" value="${esc(filter)}">
      <div class="legend"><span><i style="background:var(--ok)"></i>◎一致</span><span><i style="background:color-mix(in srgb,var(--ok) 55%,var(--surface2))"></i>○要点同じ</span><span><i style="background:var(--mid)"></i>△ずれ</span><span><i style="background:var(--ng)"></i>×不一致</span><span>（初回の解答と公式解答例の照合結果。△×の箇所は解説を公式に沿って修正済み）</span></div>`;
    let shown = 0;
    for (const e of exams) {
      const qs = e.questions.filter(q => !f || (q.theme + q.lead).toLowerCase().includes(f));
      if (!qs.length) continue;
      shown += qs.length;
      html += `<section class="exam"><div class="exam-h"><h2>${esc(e.label)}</h2><a href="#/${e.id}">回の総括 →</a></div><div class="grid">`;
      for (const q of qs) {
        const done = store.get(doneKey(e.id, q.no), false);
        html += `<a class="card" href="#/${e.id}/${q.no}">${done ? '<span class="done">✓ 解いた</span>' : ""}
          <div class="qno">問${q.no}</div><div class="theme">${esc(q.theme || "（テーマ不明）")}</div>
          <div class="lead">${esc(q.lead)}</div>${judgeBar(q.judge)}</a>`;
      }
      html += `</div></section>`;
    }
    if (!shown) html += `<p class="sub">該当する問題がありません。</p>`;
    $app.innerHTML = html;
    const inp = document.getElementById("q");
    inp.oninput = () => { const pos = inp.selectionStart; viewHome(inp.value); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  }

  async function viewExam(id) {
    const e = manifest.exams.find(x => x.id === id);
    if (!e) return viewNotFound();
    let html = `<div class="crumbs"><a href="#/">トップ</a> / ${esc(e.label)}</div>
      <h1 class="page">${esc(e.label)} 午後</h1><p class="sub">問1〜問4から2問選択。</p><div class="grid" style="margin-bottom:22px">`;
    for (const q of e.questions) html += `<a class="card" href="#/${e.id}/${q.no}"><div class="qno">問${q.no}</div><div class="theme">${esc(q.theme)}</div><div class="lead">${esc(q.lead)}</div>${judgeBar(q.judge)}</a>`;
    html += `</div>`;
    $app.innerHTML = html + `<div class="panel"><p class="sub">照合の総括を読み込み中…</p></div>`;
    try {
      const sh = splitSections(await load(`${id}/shougou.md`));
      $app.innerHTML = html + `<div class="panel">${render(sh.head + sh.common.join(""))}</div>
        <p class="sub" style="margin-top:14px">原本：<a href="../pdf/${id}_sc_pm_qs.pdf">問題PDF</a> ・ <a href="../pdf/${id}_sc_pm_ans.pdf">解答例PDF</a></p>`;
    } catch (err) {
      $app.innerHTML = html + `<div class="panel"><p class="sub">照合結果はまだありません。</p></div>`;
    }
  }

  async function viewQuestion(id, no, tab) {
    const e = manifest.exams.find(x => x.id === id);
    const q = e && e.questions.find(x => x.no === no);
    if (!q) return viewNotFound();
    const idx = e.questions.indexOf(q);
    const prev = e.questions[idx - 1], next = e.questions[idx + 1];
    const tabs = [["mondai", "問題文"], ["kaisetsu", "解答・解説"], ["shougou", "公式との照合"]];
    tab = tabs.some(t => t[0] === tab) ? tab : "mondai";
    const done = store.get(doneKey(id, no), false);
    $app.innerHTML = `<div class="qview"><div class="crumbs"><a href="#/">トップ</a> / <a href="#/${id}">${esc(e.label)}</a> / 問${no}</div>
      <div class="qhead"><h1 class="page">問${no} ${esc(q.theme)}</h1>
        <label class="check"><input type="checkbox" id="done" ${done ? "checked" : ""}> 解いた</label></div>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${l}</button>`).join("")}</div>
      <div class="panel" id="panel"><p class="sub">読み込み中…</p></div>
      <div class="pager"><span>${prev ? `<a href="#/${id}/${prev.no}">← 問${prev.no} ${esc(prev.theme)}</a>` : ""}</span><span>${next ? `<a href="#/${id}/${next.no}">問${next.no} ${esc(next.theme)} →</a>` : ""}</span></div></div>`;
    document.body.classList.add("in-q");
    qbar.innerHTML = `<div class="wrap">
      <a href="${prev ? `#/${id}/${prev.no}/${tab}` : "#"}" class="${prev ? "" : "dis"}" aria-label="前の問題">◀ 問${prev ? prev.no : ""}</a>
      <button id="tocBtn">目次・文字</button>
      <button id="doneBtn" class="${done ? "on" : ""}">${done ? "✓ 解いた" : "解いた"}</button>
      <a href="${next ? `#/${id}/${next.no}/${tab}` : "#"}" class="${next ? "" : "dis"}" aria-label="次の問題">問${next ? next.no : ""} ▶</a></div>`;
    qbar.hidden = false;
    document.getElementById("doneBtn").onclick = ev => {
      const v = !store.get(doneKey(id, no), false); store.set(doneKey(id, no), v);
      ev.currentTarget.classList.toggle("on", v); ev.currentTarget.textContent = v ? "✓ 解いた" : "解いた";
      document.getElementById("done").checked = v;
    };
    document.getElementById("tocBtn").onclick = openToc;
    document.getElementById("done").onchange = ev => store.set(doneKey(id, no), ev.target.checked);
    // タブごとのスクロール位置を覚えて，問題文と解答を行き来しても読んでいた位置に戻る
    const posKey = `${id}/${no}/${tab}`;
    $app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { location.hash = `#/${id}/${no}/${b.dataset.tab}`; });
    const panel = document.getElementById("panel");
    const show = async () => {
      try {
        if (tab === "mondai") {
          panel.innerHTML = render(await load(`${id}/mondai_q${no}.md`));
          tidy(panel); linkRefs(panel); restore();
        } else {
          const file = tab === "kaisetsu" ? "kaitou_kaisetsu.md" : "shougou.md";
          const sec = splitSections(await load(`${id}/${file}`)).q[no];
          panel.innerHTML = sec ? render(sec) : `<p class="sub">まだ用意されていません。</p>`;
          tidy(panel); restore();
        }
      } catch (err) { panel.innerHTML = `<p class="err">読み込みに失敗しました：${esc(err.message)}</p>`; }
    };
    const restore = () => window.scrollTo(0, scrollPos[posKey] || 0);
    curPosKey = posKey;
    const revealKey = "reveal:" + id + ":" + no;
    if (tab !== "mondai" && !store.get(revealKey, false)) {
      panel.innerHTML = `<div class="gate"><p>先に自分で解いてみましょう。<br>答えを表示すると、この問題では次回から確認なしで表示します。</p>
        <button class="btn" id="reveal">答えを表示する</button></div>`;
      document.getElementById("reveal").onclick = () => { store.set(revealKey, true); show(); };
    } else show();
    window.scrollTo(0, scrollPos[posKey] || 0);
  }

  const scrollPos = {};
  let curPosKey = null;
  let lastY = 0;
  addEventListener("scroll", () => {
    if (curPosKey) scrollPos[curPosKey] = scrollY;
    // 読み進めている（下へスクロール）間はバーを隠す。上へ戻す・先頭付近・末尾付近では出す
    const y = scrollY, d = y - lastY, nearEnd = y + innerHeight > document.documentElement.scrollHeight - 80;
    if (y < 120 || nearEnd || d < -8) document.body.classList.remove("reading");
    else if (d > 8) document.body.classList.add("reading");
    if (Math.abs(d) > 8) lastY = y;
  }, { passive: true });
  const qbar = document.createElement("nav");
  qbar.className = "qbar"; qbar.hidden = true; document.body.appendChild(qbar);
  const sheet = document.createElement("div"); document.body.appendChild(sheet);
  const closeToc = () => { sheet.innerHTML = ""; };
  // 段落を「。」ごとに区切り，空欄を枠で囲む
  const BOX = /[\u2500-\u257F]/;
  const WIDE = /[\u1100-\u115F\u2E80-\u303E\u3041-\u33FF\u3400-\u4DBF\u4E00-\u9FFF\uA000-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFF60\uFFE0-\uFFE6]/;
  const JA = /[\u3040-\u30FF\u4E00-\u9FFF]/g;
  // 罫線図は1文字ずつマスに置き，画面幅に収まるよう文字サイズを決める
  function fitDiagram(pre) {
    const cols = +pre.dataset.cols, avail = pre.clientWidth - 24;
    const fs = Math.max(10.5, Math.min(13, avail / (cols * 0.62)));
    pre.style.fontSize = fs + "px"; pre.style.setProperty("--cw", (fs * 0.62) + "px");
    pre.classList.toggle("wide", cols * fs * 0.62 > avail + 1);
  }
  function tidyCode(root) {
    root.querySelectorAll(".md pre > code").forEach(code => {
      if (/language-/.test(code.className)) return;
      const pre = code.parentElement, text = code.textContent.replace(/\n$/, "");
      if (BOX.test(text)) {
        let cols = 0;
        const html = text.split("\n").map(line => {
          let w = 0;
          const cells = [...line].map(ch => {
            const wide = WIDE.test(ch); w += wide ? 2 : 1;
            return `<span class="c${wide ? " w" : ""}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`;
          }).join("");
          cols = Math.max(cols, w);
          return `<span class="ln">${cells}</span>`;
        }).join("");
        pre.classList.add("diagram"); pre.dataset.cols = cols; pre.innerHTML = html;
        fitDiagram(pre);
        return;
      }
      const chars = text.replace(/\s/g, "").length, ja = (text.match(JA) || []).length;
      if (!chars || ja / chars < 0.3) return;
      // 行頭が空白の行は前の行の続き（元の紙面での折り返し）とみなしてつなぐ
      const lines = [];
      for (const line of text.split("\n")) {
        if (/^[ \u3000]+\S/.test(line) && lines.length && !/^[ \u3000]*$/.test(lines[lines.length - 1])) lines[lines.length - 1] += line.trim();
        else lines.push(line.replace(/\s+$/, ""));
      }
      const div = document.createElement("div");
      div.className = "figtext";
      div.innerHTML = esc(lines.join("\n")).replace(/［\s*([^］\n]{1,6}?)\s*］/g, '<span class="blank">$1</span>');
      pre.replaceWith(div);
    });
  }
  addEventListener("resize", () => document.querySelectorAll("pre.diagram").forEach(fitDiagram));
  function tidy(root) {
    tidyCode(root);
    root.querySelectorAll(".md li, .md td").forEach(el => {
      if (el.querySelector("p")) return;
      el.innerHTML = el.innerHTML.replace(/［\s*([^］<]{1,6}?)\s*］/g, '<span class="blank">$1</span>');
    });
    root.querySelectorAll(".md p").forEach(p => {
      p.innerHTML = p.innerHTML.replace(/［\s*([^］<]{1,6}?)\s*］/g, '<span class="blank">$1</span>');
      if (!store.get("split", true) || p.closest("td, blockquote") || p.classList.contains("q-anchor")) return;
      const parts = p.innerHTML.split(/(?<=。)(?![」）』\)]|<\/)/);
      if (parts.length > 1) p.innerHTML = parts.filter(x => x.trim()).map(x => `<span class="sn">${x}</span>`).join("");
    });
  }
  // 設問中の「下線①」「［ b ］」「表5」「図3」「〔…〕」をタップすると本文の該当箇所へ飛ぶ
  function linkRefs(root) {
    const md = root.querySelector(".md"); if (!md) return;
    const all = [...md.children];
    const qi = all.findIndex(el => (el.tagName === "H2" && /^設問/.test(el.textContent.trim())) || el.classList.contains("q-anchor"));
    if (qi < 0) return;
    const body = all.slice(0, qi), qs = all.slice(qi);
    const targets = {};
    const put = (k, el) => { if (!targets[k]) { if (!el.id) el.id = "t" + Math.random().toString(36).slice(2, 8); targets[k] = el.id; } };
    for (const el of body) {
      el.querySelectorAll(".diagram .ln").forEach(ln => {
        const cells = [...ln.children], text = cells.map(c => c.textContent).join("");
        for (const m of text.matchAll(/［[\s\u00a0]*([^］\s\u00a0]{1,6})[\s\u00a0]*］/g)) {
          const k = "bl:" + m[1];
          if (targets[k]) continue;
          const from = [...text.slice(0, m.index)].length, to = from + [...m[0]].length;
          cells.slice(from, to).forEach(c => c.classList.add("dblank"));
          put(k, cells[from]);
        }
      });
      // ソースコードや設定例の中の空欄も枠で囲んで飛び先にする
      el.querySelectorAll("pre:not(.diagram) code").forEach(code => {
        if (/［/.test(code.textContent)) code.innerHTML = code.innerHTML.replace(/［\s*([^］\s]{1,6})\s*］/g, '<span class="blank">$1</span>');
      });
      el.querySelectorAll(".blank").forEach(b => put("bl:" + b.textContent.trim(), b));
      if (el.tagName === "H2") put("sec:" + el.textContent.trim(), el);
      const st = el.tagName === "P" && el.firstElementChild && el.firstElementChild.tagName === "STRONG" ? el.firstElementChild.textContent.trim() : "";
      const fm = st.match(/^([表図]\d+)\s/); if (fm) put("fig:" + fm[1], el);
      // 丸数字（下線の番号）は最初に出てきた箇所を囲む
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
      for (let t of nodes) {
        for (;;) {
          const m = [...t.nodeValue.matchAll(/[\u2460-\u2473]/g)].find(x => !targets["ul:" + x[0]]);
          if (!m) break;
          const mark = t.splitText(m.index), after = mark.splitText(1);
          const u = mark.parentElement.closest("u");
          if (u) put("ul:" + m[0], u);
          else { const span = document.createElement("span"); mark.replaceWith(span); span.appendChild(mark); put("ul:" + m[0], span); }
          t = after;
        }
      }
    }
    const link = (k, text) => targets[k] ? `<a href="#" class="ref" data-to="${targets[k]}">${text}</a>` : text;
    for (const el of qs) [...(el.matches("p, li") ? [el] : []), ...el.querySelectorAll("p, li")].forEach(x => {
      if (x.querySelector("p")) return;
      // 入れ子のリスト（解答群など）がある項目は，その手前の本文だけを対象にする
      const html = x.innerHTML, cut = html.search(/<(ul|ol)\b/), head = cut < 0 ? html : html.slice(0, cut);
      x.innerHTML = head
        .replace(/下線([\u2460-\u2473])/g, (m, c) => link("ul:" + c, m))
        .replace(/(?<![\w"=])([表図]\d+)(?![^<]*>)/g, (m, f) => link("fig:" + f, m))
        .replace(/〔[^〕<]+〕/g, m => link("sec:" + m, m))
        .replace(/<span class="blank">([^<]+)<\/span>/g, (m, b) => link("bl:" + b.trim(), m)) + (cut < 0 ? "" : html.slice(cut));
    });
    md.querySelectorAll("a.ref").forEach(a => a.onclick = ev => {
      ev.preventDefault();
      const back = scrollY, t = document.getElementById(a.dataset.to);
      t.scrollIntoView({ block: "center" });
      t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash");
      backBtn.hidden = false;
      backBtn.onclick = () => { scrollTo(0, back); backBtn.hidden = true; };
    });
  }
  const backBtn = document.createElement("button");
  backBtn.className = "backbtn"; backBtn.hidden = true; backBtn.textContent = "↩ 設問に戻る";
  document.body.appendChild(backBtn);
  function openToc() {
    const heads = [...document.querySelectorAll("#panel .md h2, #panel .md h3, #panel .md .q-anchor")];
    const fs = store.get("fs", 1);
    sheet.innerHTML = `<div class="sheet-bg"></div><div class="sheet" role="dialog" aria-label="目次"><div class="wrap">
      <div class="grab"></div>
      <div class="fsrow"><span>文字</span><button data-fs="-1">A−</button><button data-fs="0">標準</button><button data-fs="1">A＋</button><span class="num">${Math.round(fs * 100)}%</span></div>
      <div class="fsrow"><span>改行</span><button data-split="1" class="${store.get("split", true) ? "on" : ""}">1文ずつ</button><button data-split="0" class="${store.get("split", true) ? "" : "on"}">原文どおり</button></div>
      <h3>目次</h3>
      <div class="toc">${heads.length ? heads.map(h => {
        const cls = h.classList.contains("q-anchor") ? "qs" : (h.tagName === "H3" ? "lv3" : "");
        const t = h.classList.contains("q-anchor") ? h.querySelector("strong").textContent : h.textContent;
        return `<a href="#" data-to="${h.id}" class="${cls}">${esc(t)}</a>`;
      }).join("") : '<p class="sub">見出しがありません。</p>'}</div>
    </div></div>`;
    sheet.querySelector(".sheet-bg").onclick = closeToc;
    sheet.querySelectorAll("[data-to]").forEach(a => a.onclick = ev => {
      ev.preventDefault(); closeToc(); document.getElementById(a.dataset.to).scrollIntoView({ block: "start" });
    });
    sheet.querySelectorAll("[data-split]").forEach(b => b.onclick = () => {
      store.set("split", b.dataset.split === "1"); closeToc(); route();
    });
    sheet.querySelectorAll("[data-fs]").forEach(b => b.onclick = () => {
      const d = +b.dataset.fs, cur = store.get("fs", 1);
      const v = d === 0 ? 1 : Math.min(1.4, Math.max(0.8, Math.round((cur + d * 0.1) * 10) / 10));
      store.set("fs", v); applyFs(); openToc();
    });
  }
  const applyFs = () => document.documentElement.style.setProperty("--fs", store.get("fs", 1));
  applyFs();

  function viewNotFound() { $app.innerHTML = `<p class="sub">ページが見つかりません。<a href="#/">トップへ</a></p>`; }

  function route() {
    closeToc(); backBtn.hidden = true; qbar.hidden = true; document.body.classList.remove("in-q", "reading"); curPosKey = null;
    const [, id, no, tab] = location.hash.replace(/^#/, "").split("/");
    if (!id) return viewHome();
    if (!no) return viewExam(id);
    return viewQuestion(id, +no, tab);
  }

  fetch("manifest.json").then(r => r.json()).then(m => { manifest = m; window.addEventListener("hashchange", route); route(); })
    .catch(err => { $app.innerHTML = `<p class="err">manifest.json を読み込めませんでした：${esc(err.message)}</p>`; });
})();
</script>
</body>
</html>
